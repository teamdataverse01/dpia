services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: privacy_risk
      POSTGRES_USER: privacy_risk
      POSTGRES_PASSWORD: privacy_risk_dev
    ports:
      - "55432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacy_risk -d privacy_risk"]
      interval: 3s
      retries: 20

  app:
    build: docker/php
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    command: php -S 0.0.0.0:8080 -t public public/index.php

volumes:
  dbdata:
